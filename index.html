#app{display:flex;min-height:100vh}
aside{width:280px;background:linear-gradient(180deg,#FFE44D,#FFD21F);color:#000;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
aside h1{font-size:17px;font-weight:800;margin:4px 8px 14px;line-height:1.3;letter-spacing:.5px}
aside a{display:block;padding:11px 12px;border-radius:8px;color:#000;cursor:pointer;margin:2px 0;font-size:17px;font-weight:700}

main{flex:1;padding:18px;min-width:0}
.top{display:none}
h2{margin:0 0 14px;color:#000;font-size:30px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.b,.b2{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:800;font-size:17px}
.b{background:var(--g);color:#000}.b:hover{background:var(--g2)}.b2{background:#fff3b0;color:#000}
.sm{padding:5px 9px;font-size:15px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;border-top:4px solid var(--g)}
.card small{color:#000;font-size:16px}.card b{display:block;font-size:26px;margin-top:4px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}

.s{max-width:320px;margin-bottom:10px}

let CQ="",DQ="";

function dcf(){const bc=DE.t=="bc",e=$("#dpc");if(e)e.outerHTML=cSel("dpc",DB[bc?"fournisseurs":"clients"],DQ,DE.party,bc?"—":"Client comptoir","DE.party=this.value;DQ='';$('#dcs').value='';dcf()")}
/* LOGIN */
let pin="";
function login(){$("#lg").style.display="flex";const sg=DB.set.nom+"|"+LG().length;if(!$("#lg .fr")||window._lgs!=sg){window._lgs=sg;const g=Array(6).fill(esc(DB.set.nom)+" ✦ ").join(""),s=`<span>${g+g}</span>`;$("#lg").innerHTML=`${LI(130,"margin-bottom:12px;box-shadow:0 4px 18px #0003")}<h1 class=lt>${esc(DB.set.nom)}</h1><div class=fr><div class="mq t">${s}</div><div class="mq b">${s}</div><div class="mq l">${s}</div><div class="mq r">${s}</div><div class=lb id=lb></div></div>`}$("#lb").innerHTML=`<small style="color:var(--mut)">Entrez votre code à 4 chiffres</small><div class=dots>${[0,1,2,3].map(i=>`<i class="${i<pin.length?"f":""}"></i>`).join("")}</div><div class=kp>${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>`<button onclick="kp('${k}')" ${k===""?"style=visibility:hidden":""}>${k}</button>`).join("")}</div><p id=er class=red></p>`}
function kp(k){if(k=="⌫")pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;login();if(pin.length==4){if(pin==DB.set.pin){OK=true;pin="";$("#lg").style.display="none";render()}else{pin="";login();$("#er").textContent="Code incorrect"}}}
document.addEventListener("keydown",e=>{if(!OK&&/^\d$/.test(e.key))kp(e.key)});
/* SHELL */
function nav(p,d){DE=null;page=p;detail=d||null;Q="";$("aside")&&$("aside").classList.remove("o");render()}
function render(){if(!OK)return login();
$("#app").innerHTML=`<aside>${LG()?`<div style="text-align:center;margin:2px 0 6px">${LI(110)}</div>`:""}<h1>${esc(DB.set.nom)}</h1>${MENU.map(([k,l])=>`<a class="${page==k?"on":""}" onclick="nav('${k}')">${l}</a>`).join("")}<a onclick="OK=false;login();$('#app').innerHTML=''">Verrouiller</a></aside><main><div class=top><button class=b onclick="$('aside').classList.toggle('o')">☰</button>${LI(38)}<b>${esc(DB.set.nom)}</b></div>${page2()}</main>`}
function page2(){if(DE)return docEdit();if(detail)return fiche(page,detail);if(T[page]&&page!="vente")return docList(page);return(P[page]||(()=>list(page)))()}
const head=(t,a="")=>`<h2>${t}<span>${a}</span></h2>`;
function modal(h){$("#mo").style.display="flex";$("#mo").innerHTML=`<div class=m>${h}</div>`}
function closeM(){$("#mo").style.display="none"}
function ask(msg,fn){CB=fn;modal(`<p>${msg}</p><div class=ac><button class=b2 onclick=closeM()>Annuler</button><button class=b onclick="closeM();CB()">Confirmer</button></div>`)}
/* LISTES GENERIQUES */
function tbl(c){const q=Q.toLowerCase(),cf=C[c];const rows=DB[c].filter(r=>JSON.stringify(r).toLowerCase().includes(q));let s=0;
return `<table><tr>${cf.cols.map(k=>`<th>${lab(c,k)}</th>`).join("")}<th></th></tr>${rows.map(r=>{if(r.mt)s+=r.mt;return`<tr>${cf.cols.map((k,j)=>{let v=r[k];let x=M.has(k)?f(v):esc(v);if(k=="stock"&&v<=r.min)x=`<span class=red>${x}</span>`;if(k=="nom"&&c=="produits")x=im(r.img)+x;if(j==0&&(c=="clients"||c=="fournisseurs"))x=`<a style="cursor:pointer;color:var(--gd);font-weight:800;text-decoration:underline" onclick="nav('${c}','${r.id}')">${x}</a>`;return`<td>${x}</td>`}).join("")}<td>${c=="produits"?`<button class="b2 sm" onclick="stk('${r.id}')">+ Stock</button> `:""}${c=="clients"||c=="fournisseurs"?`<button class="b sm" onclick="nav('${c}','${r.id}')">📋 Historique</button> `:""}${c=="depots"?`<button class="b sm" onclick="dep('${r.id}',1)">+ Ajouter</button> <button class="b2 sm" onclick="dep('${r.id}',-1)">− Retirer</button> <button class="b2 sm" onclick="dph('${r.id}')">Historique</button> `:""}${c=="prets"&&r.mt>(r.rem||0)?`<button class="b sm" onclick="regp('${r.id}')">Régler</button> `:""}<button class="b2 sm" onclick="frm('${c}','${r.id}')">✎</button> <button class="b2 sm" onclick="del('${c}','${r.id}')">✕</button></td></tr>`}).join("")||`<tr><td colspan=9>Aucun enregistrement</td></tr>`}${cf.cols.includes("mt")?`<tfoot><tr><td colspan=${cf.cols.length+1}>Total : ${f(s)}</td></tr></tfoot>`:""}</table>`}
function list(c){return head(C[c].t,`<button class=b onclick="frm('${c}')">+ Nouveau</button>`)+`<input class=s placeholder="Rechercher…" oninput="Q=this.value;$('#tb').innerHTML=tbl('${c}')"><div class=tw id=tb>${tbl(c)}</div>`}
function frm(c,i){const o=i?by(c,i):{};modal(`<h3>${i?"Modifier":"Nouveau"} ${C[c].s}</h3><div class=fg>${C[c].f.map(([k,l,t,op])=>`<label>${l}${t=="img"?`<input type=file accept="image/*" onchange="pimg(this)"><input type=hidden id=f_img value="${esc(o.img||"")}"><img id=pvw src="${esc(o.img||"")}" style="max-height:90px;display:${o.img?"block":"none"};margin-top:6px;border-radius:8px">`:t=="select"?`<select id=f_${k}>${op.map(v=>`<option${o[k]==v?" selected":""}>${v}</option>`).join("")}</select>`:t=="textarea"?`<textarea id=f_${k}>${esc(o[k])}</textarea>`:`<input id=f_${k} type="${t||"text"}" value="${esc(o[k]??(t=="date"?today():""))}">`}</label>`).join("")}</div><div class=ac><button class=b2 onclick=cx()>Annuler</button><button class=b onclick="sv('${c}','${i||""}')">Enregistrer</button></div>`)}
function pimg(el){const fl=el.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,240/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);const u=c.toDataURL("image/jpeg",.75);$("#f_img").value=u;const p=$("#pvw");p.src=u;p.style.display="block"};i.src=r.result};r.readAsDataURL(fl)}
function sv(c,i){const o=i?by(c,i):{id:id()};C[c].f.forEach(([k,,t])=>{const v=$("#f_"+k).value;o[k]=t=="number"?+v||0:v});if(!i)DB[c].push(o);if(!i&&c=="clients")VC=o.id;if(!i&&DE){if(c=="produits")L.push({p:o.id,q:1,pu:DE.t=="bc"?o.pa:o.pv});else if(c=="clients"||c=="fournisseurs")DE.party=o.id}if(!i&&c=="produits"&&!BACK&&page=="vente")CART.push({p:o.id,q:1,pu:o.pv});save();closeM();if(BACK){BACK=0;if(c=="produits"){const e=DR.L.findIndex(l=>!l.p),n={p:o.id,q:1,pu:CT=="bc"?o.pa:o.pv};e<0?DR.L.push(n):DR.L[e]=n}else DR.party=o.id;openDoc(DR.t,DR.id,DR)}else render()}
function qadd(c){DR={t:CT,id:EDIT?EDIT.id:null,party:$("#dp").value,date:$("#dd").value,paid:+$("#dpd").value||0,note:$("#dn").value,rem:0,mode:$("#dmd").value,L:L};BACK=1;frm(c)}
function cx(){closeM();if(BACK){BACK=0;openDoc(DR.t,DR.id,DR)}}
function del(c,i){ask("Supprimer cet enregistrement ?",()=>{DB[c]=DB[c].filter(x=>x.id!=i);save();render()})}
function stk(i){modal(`<h3>Entrée de stock — ${esc(nm("produits",i))}</h3><label>Quantité reçue<input id=sq type=number value=1></label><div class=ac><button class=b2 onclick=closeM()>Annuler</button><button class=b onclick="by('produits','${i}').stock+=+$('#sq').value||0;save();closeM();render()">Ajouter</button></div>`)}
/* FICHES CLIENT / FOURNISSEUR */
function fiche(c,i){const p=by(c,i);if(!p)return list(c);const cl=c=="clients",nl=p.nom.toLowerCase();
const ds=DB.docs.filter(d=>d.party==i&&(cl?d.type!="bc":d.type=="bc"));
const dp=DB.depots.filter(x=>(x.tiers||"").toLowerCase()==nl),pr=DB.prets.filter(x=>(x.tiers||"").toLowerCase()==nl);
const cnt=cl?isS:(d=>d.type=="bc"),T1=ds.filter(cnt).reduce((s,d)=>s+tot(d),0),P1=ds.filter(cnt).reduce((s,d)=>s+paid(d),0),D=dp.reduce((s,x)=>s+x.mt,0);
const dl=d=>d.lines.map(l=>esc(nm("produits",l.p))+" ×"+l.q).join(", ");

const firebaseConfig = {

  authDomain: "ndiambour-quincaillerie.firebaseapp.com",
  projectId: "ndiambour-quincaillerie",

let lastPush = "";

  try{
    if(pulling) return;
    const j = JSON.stringify(DB);

      lastPush = j;
      setDoc(ref, { data: DB, updatedAt: new Date().toISOString() });

  }catch(e){}

  try{

    if(!d) return;
    const j = JSON.stringify(d);
    if(j === lastPush) return;
    lastPush = j;
    pulling = true;
    // On sauvegarde dans le navigateur et on recharge pour afficher
    Object.keys(DB).forEach(k=>{ DB[k]=d[k]; });
    try{ localStorage.setItem("ndiambour_db", j); }catch(e){}
    setTimeout(()=>{ pulling=false; location.reload(); }, 500);
  }catch(e){ pulling=false; }
});
