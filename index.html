:root{--g:#FFD21F;--g2:#FFE680;--gd:#000;--bg:#fff;--card:#fff;--tx:#000;--mut:#222;--bd:#f3dd6b;--red:#b3261e;--grn:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#fff;color:#000;font-size:18px;font-weight:700}
#app{display:flex;min-height:100vh}
aside{width:280px;background:linear-gradient(180deg,#FFE44D,#FFD21F);color:#000;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
aside h1{font-size:17px;font-weight:800;margin:4px 8px 14px;line-height:1.3;letter-spacing:.5px}
aside a{display:block;padding:11px 12px;border-radius:8px;color:#000;cursor:pointer;margin:2px 0;font-size:17px;font-weight:700}
aside a:hover{background:#ffffff88}aside a.on{background:#fff;color:#000;font-weight:800}
main{flex:1;padding:18px;min-width:0}
.top{display:none}
h2{margin:0 0 14px;color:#000;font-size:30px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.b,.b2{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:800;font-size:17px}
.b{background:var(--g);color:#000}.b:hover{background:var(--g2)}.b2{background:#fff3b0;color:#000}
.sm{padding:5px 9px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;border-top:4px solid var(--g)}
.card small{color:#000;font-size:16px}.card b{display:block;font-size:26px;margin-top:4px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%}th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--g);color:#000;font-size:17px;font-weight:800}tfoot td{font-weight:700;background:var(--bd)}

.s{max-width:320px;margin-bottom:10px}

.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.pg div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer}.pg div:hover{border-color:var(--g)}
#lg{position:fixed;inset:0;background:linear-gradient(135deg,#FFE44D,#FFD21F);--card:#fff;--tx:#2b2415;--bd:#ece3c6;--mut:#7a7058;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:16px;overflow:auto}
.fr{position:relative;padding:36px;background:#1a1a1a;border:3px solid #fff;border-radius:22px;box-shadow:0 10px 40px #0002;max-width:100%}.mq{position:absolute;overflow:hidden;white-space:nowrap;color:#FFD21F;font-weight:800;font-size:14px;letter-spacing:2px}.mq span{display:inline-block}.mq.t,.mq.b{left:0;right:0;height:36px;line-height:36px}.mq.t{top:0}.mq.b{bottom:0}.mq.l,.mq.r{top:36px;bottom:36px;width:36px}.mq.l{left:0}.mq.r{right:0}.mq.t span{animation:mh 40s linear infinite}.mq.b span{animation:mh 40s linear infinite reverse}.mq.l span,.mq.r span{writing-mode:vertical-rl;line-height:36px;animation:mv 40s linear infinite}.mq.r span{animation-direction:reverse}@keyframes mh{to{transform:translateX(-50%)}}@keyframes mv{to{transform:translateY(-50%)}}
.lb{background:#fff;border-radius:12px;padding:22px;text-align:center;width:300px;max-width:100%}

/* RECHERCHE CLIENT */
let CQ="",DQ="";
const nrm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function cSel(id,list,q,sel,blank,oc){const k=nrm(q),m=list.filter(x=>!k||x.id==sel||nrm(x.nom).includes(k)||nrm(x.tel).includes(k)),n=k?m.length+1:1;return `<select id="${id}" ${k&&n>1?`size="${Math.min(n,6)}"`:""} onchange="${oc}"><option value="">${blank}</option>${m.map(x=>`<option value="${x.id}"${x.id==sel?" selected":""}>${esc(x.nom)}${x.tel?" — "+esc(x.tel):""}</option>`).join("")}</select>${k&&m.length==0?'<small class=red>Aucun résultat</small>':""}`}
function vcf(){const e=$("#vc");if(e)e.outerHTML=cSel("vc",DB.clients,CQ,VC,"Client comptoir","VC=this.value;CQ='';$('#vcs').value='';vcf()")}
function dcf(){const bc=DE.t=="bc",e=$("#dpc");if(e)e.outerHTML=cSel("dpc",DB[bc?"fournisseurs":"clients"],DQ,DE.party,bc?"—":"Client comptoir","DE.party=this.value;DQ='';$('#dcs').value='';dcf()")}
/* LOGIN */
let pin="";
function login(){$("#lg").style.display="flex";const sg=DB.set.nom+"|"+LG().length;if(!$("#lg .fr")||window._lgs!=sg){window._lgs=sg;const g=Array(6).fill(esc(DB.set.nom)+" ✦ ").join(""),s=`<span>${g+g}</span>`;$("#lg").innerHTML=`${LI(130,"margin-bottom:12px;box-shadow:0 4px 18px #0003")}<h1 class=lt>${esc(DB.set.nom)}</h1><div class=fr><div class="mq t">${s}</div><div class="mq b">${s}</div><div class="mq l">${s}</div><div class="mq r">${s}</div><div class=lb id=lb></div></div>`}$("#lb").innerHTML=`<small style="color:var(--mut)">Entrez votre code à 4 chiffres</small><div class=dots>${[0,1,2,3].map(i=>`<i class="${i<pin.length?"f":""}"></i>`).join("")}</div><div class=kp>${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>`<button onclick="kp('${k}')" ${k===""?"style=visibility:hidden":""}>${k}</button>`).join("")}</div><p id=er class=red></p>`}
function kp(k){if(k=="⌫")pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;login();if(pin.length==4){if(pin==DB.set.pin){OK=true;pin="";$("#lg").style.display="none";render()}else{pin="";login();$("#er").textContent="Code incorrect"}}}
document.addEventListener("keydown",e=>{if(!OK&&/^\d$/.test(e.key))kp(e.key)});
/* SHELL */
function nav(p,d){DE=null;page=p;detail=d||null;Q="";$("aside")&&$("aside").classList.remove("o");render()}
function render(){if(!OK)return login();
$("#app").innerHTML=`<aside>${LG()?`<div style="text-align:center;margin:2px 0 6px">${LI(110)}</div>`:""}<h1>${esc(DB.set.nom)}</h1>${MENU.map(([k,l])=>`<a class="${page==k?"on":""}" onclick="nav('${k}')">${l}</a>`).join("")}<a onclick="OK=false;login();$('#app').innerHTML=''">Verrouiller</a></aside><main><div class=top><button class=b onclick="$('aside').classList.toggle('o')">☰</button>${LI(38)}<b>${esc(DB.set.nom)}</b></div>${page2()}</main>`}
function page2(){if(DE)return docEdit();if(detail)return fiche(page,detail);if(T[page]&&page!="vente")return docList(page);return(P[page]||(()=>list(page)))()}
const head=(t,a="")=>`<h2>${t}<span>${a}</span></h2>`;
function modal(h){$("#mo").style.display="flex";$("#mo").innerHTML=`<div class=m>${h}</div>`}
function closeM(){$("#mo").style.display="none"}
function ask(msg,fn){CB=fn;modal(`<p>${msg}</p><div class=ac><button class=b2 onclick=closeM()>Annuler</button><button class=b onclick="closeM();CB()">Confirmer</button></div>`)}
/* LISTES GENERIQUES */
function tbl(c){const q=Q.toLowerCase(),cf=C[c];const rows=DB[c].filter(r=>JSON.stringify(r).toLowerCase().includes(q));let s=0;
return `<table><tr>${cf.cols.map(k=>`<th>${lab(c,k)}</th>`).join("")}<th></th></tr>${rows.map(r=>{if(r.mt)s+=r.mt;return`<tr>${cf.cols.map((k,j)=>{let v=r[k];let x=M.has(k)?f(v):esc(v);if(k=="stock"&&v<=r.min)x=`<span class=red>${x}</span>`;if(k=="nom"&&c=="produits")x=im(r.img)+x;if(j==0&&(c=="clients"||c=="fournisseurs"))x=`<a style="cursor:pointer;color:var(--gd);font-weight:800;text-decoration:underline" onclick="nav('${c}','${r.id}')">${x}</a>`;return`<td>${x}</td>`}).join("")}<td>${c=="produits"?`<button class="b2 sm" onclick="stk('${r.id}')">+ Stock</button> `:""}${c=="clients"||c=="fournisseurs"?`<button class="b sm" onclick="nav('${c}','${r.id}')">📋 Historique</button> `:""}${c=="depots"?`<button class="b sm" onclick="dep('${r.id}',1)">+ Ajouter</button> <button class="b2 sm" onclick="dep('${r.id}',-1)">− Retirer</button> <button class="b2 sm" onclick="dph('${r.id}')">Historique</button> `:""}${c=="prets"&&r.mt>(r.rem||0)?`<button class="b sm" onclick="regp('${r.id}')">Régler</button> `:""}<button class="b2 sm" onclick="frm('${c}','${r.id}')">✎</button> <button class="b2 sm" onclick="del('${c}','${r.id}')">✕</button></td></tr>`}).join("")||`<tr><td colspan=9>Aucun enregistrement</td></tr>`}${tfootG(c,rows)}</table>`}
function tfootG(c,rows){const cf=C[c],n=cf.cols.length+1,sm=k=>rows.reduce((a,r)=>a+(+r[k]||0),0);if(!rows.length)return"";
const row=g=>`<tr>${cf.cols.map((k,j)=>`<td>${j==0?"TOTAL ("+rows.length+")":g(k)}</td>`).join("")}<td></td></tr>`,xt=h=>`<tr><td colspan=${n}>${h}</td></tr>`;
if(c=="produits"){const sa=rows.reduce((a,r)=>a+(+r.stock||0)*(+r.pa||0),0),sv=rows.reduce((a,r)=>a+(+r.stock||0)*(+r.pv||0),0);
return`<tfoot>${row(k=>k=="stock"?nf(sm("stock")):"")}${xt(`Valeur du stock : à l’achat <b>${f(sa)}</b> · à la vente <b>${f(sv)}</b> · bénéfice potentiel <b class="${sv-sa<0?"red":"grn"}">${f(sv-sa)}</b>`)}</tfoot>`}
if(!cf.cols.includes("mt"))return"";
let x="";
if(c=="prets"){const A=rows.filter(r=>r.sens=="Prêt accordé"),E=rows.filter(r=>r.sens!="Prêt accordé"),t=(l,a)=>a.length?xt(`${l} (${a.length}) : montant <b>${f(a.reduce((s,r)=>s+r.mt,0))}</b> · remboursé <b>${f(a.reduce((s,r)=>s+(r.rem||0),0))}</b> · reste <b class=red>${f(a.reduce((s,r)=>s+r.mt-(r.rem||0),0))}</b>`):"";x=t("Prêts accordés",A)+t("Emprunts reçus",E)+xt(`Reste total à régler : <b class=red>${f(sm("mt")-sm("rem"))}</b>`)}
if(c=="charges"){const ct={};rows.forEach(r=>{ct[r.cat||"Autres"]=(ct[r.cat||"Autres"]||0)+(+r.mt||0)});x=xt("Par catégorie : "+Object.entries(ct).sort((a,b)=>b[1]-a[1]).map(([k,v])=>esc(k)+" <b>"+f(v)+"</b>").join(" · "))}

else if(rt=="benv"){const r={};S.forEach(d=>d.lines.forEach(l=>{const pa=(by("produits",l.p)||{}).pa||0;r[l.p]=r[l.p]||[0,0,0];r[l.p][0]+=l.q;r[l.p][1]+=l.q*l.pu;r[l.p][2]+=l.q*pa}));const e=Object.entries(r),tt=i=>e.reduce((s,x)=>s+x[1][i],0),mg=(b,c)=>c?Math.round(b/c*100)+" %":"—",bc=v=>v<0?"red":"grn";h=`<tr><th>Produit</th><th>Qté vendue</th><th>Chiffre d’affaires</th><th>Coût d’achat</th><th>Bénéfice</th><th>Marge</th></tr>${e.map(([k,v])=>`<tr><td>${esc(nm("produits",k))}</td><td>${v[0]}</td><td>${f(v[1])}</td><td>${f(v[2])}</td><td class="${bc(v[1]-v[2])}">${f(v[1]-v[2])}</td><td>${mg(v[1]-v[2],v[1])}</td></tr>`).join("")||"<tr><td colspan=6>Aucune vente</td></tr>"}<tfoot><tr><td>TOTAL</td><td>${tt(0)}</td><td>${f(tt(1))}</td><td>${f(tt(2))}</td><td class="${bc(tt(1)-tt(2))}">${f(tt(1)-tt(2))}</td><td>${mg(tt(1)-tt(2),tt(1))}</td></tr></tfoot>`}
else if(rt=="bens"){const p=DB.produits,sm=g=>p.reduce((s,x)=>s+g(x),0),mg=(b,c)=>c?Math.round(b/c*100)+" %":"—",bc=v=>v<0?"red":"grn",ben=x=>x.stock*(x.pv-x.pa);h=`<tr><th>Produit</th><th>Stock</th><th>Prix d’achat</th><th>Prix de vente</th><th>Valeur achat</th><th>Valeur vente</th><th>Bénéfice</th><th>Marge</th></tr>${p.map(x=>`<tr><td>${esc(x.nom)}</td><td>${x.stock}</td><td>${f(x.pa)}</td><td>${f(x.pv)}</td><td>${f(x.stock*x.pa)}</td><td>${f(x.stock*x.pv)}</td><td class="${bc(ben(x))}">${f(ben(x))}</td><td>${mg(ben(x),x.stock*x.pv)}</td></tr>`).join("")||"<tr><td colspan=8>Aucun produit</td></tr>"}<tfoot><tr><td>TOTAL</td><td>${sm(x=>x.stock)}</td><td></td><td></td><td>${f(sm(x=>x.stock*x.pa))}</td><td>${f(sm(x=>x.stock*x.pv))}</td><td class="${bc(sm(ben))}">${f(sm(ben))}</td><td>${mg(sm(ben),sm(x=>x.stock*x.pv))}</td></tr></tfoot>`}
else{const p=DB.produits;h=`<tr><th>Produit</th><th>Stock</th><th>Valeur achat</th><th>Valeur vente</th></tr>${p.map(x=>`<tr><td>${esc(x.nom)}</td><td>${x.stock}</td><td>${f(x.stock*x.pa)}</td><td>${f(x.stock*x.pv)}</td></tr>`).join("")}<tfoot><tr><td>TOTAL</td><td>${p.reduce((s,x)=>s+x.stock,0)}</td><td>${f(p.reduce((s,x)=>s+x.stock*x.pa,0))}</td><td>${f(p.reduce((s,x)=>s+x.stock*x.pv,0))}</td></tr></tfoot>`}
return head("Rapports",`<button class="b2 noprint" onclick="window.print()">Imprimer</button>`)+`<div class=tabs>${tabs.map(([k,l])=>`<button class="b2 ${rt==k?"on":""}" onclick="rt='${k}';render()">${l}</button>`).join("")}</div><div class=tw><table>${h}</table></div>`};

P.params=()=>{const s=DB.set;return head("Paramètres")+`<div class=card style="max-width:640px"><div class=fg><label>Nom de l’entreprise<input id=pn value="${esc(s.nom)}"></label><label>Activités<input id=pact value="${esc(s.act||"")}" placeholder="Ex : Quincaillerie, carreaux, sanitaire…"></label><label>Adresse<input id=pa value="${esc(s.adr)}"></label><label>Téléphone<input id=pt value="${esc(s.tel)}"></label><label>NINEA<input id=pni value="${esc(s.ninea||"")}"></label><label>RC (registre du commerce)<input id=prc value="${esc(s.rc||"")}"></label><label>Gérant<input id=pg value="${esc(s.ger||"")}"></label><label>Établi par (ticket)<input id=pr value="${esc(s.par||"")}" placeholder="Vide = nom du gérant"></label><label>Devise<input id=pd value="${esc(s.dev)}"></label><label>Nouveau code (4 chiffres)<input id=pp maxlength=4 inputmode=numeric placeholder="Laisser vide = inchangé"></label></div><div style="margin-top:12px"><b>Logo</b><br><input type=file accept="image/*" onchange="plogo(this)"><input type=hidden id=plg value="${LG()}"><div style="margin-top:8px"><img id=plv src="${LG()}" style="max-height:130px;max-width:100%;display:${LG()?"block":"none"};border:1px solid var(--bd);border-radius:8px;padding:4px"> <button class="b2 sm" style="margin-top:6px" onclick="$('#plg').value='';$('#plv').style.display='none'">Retirer le logo</button> <button class="b2 sm" style="margin-top:6px" onclick="$('#plg').value=LOGO0;$('#plv').src=LOGO0;$('#plv').style.display='block'">Logo d’origine</button></div></div><div class=ac><button class=b onclick="sp()">Enregistrer</button></div><hr><button class=b2 onclick="ask('Effacer TOUTES les données ? Action irréversible.',()=>{DB=Object.assign({},def,{set:{...def.set}});save();render()})">Réinitialiser les données</button></div>`};
function plogo(el){const fl=el.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,320/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);const u=c.toDataURL("image/png");$("#plg").value=u;const p=$("#plv");p.src=u;p.style.display="block"};i.src=r.result};r.readAsDataURL(fl)}
function sp(){const s=DB.set;s.nom=$("#pn").value;s.act=$("#pact").value;s.adr=$("#pa").value;s.tel=$("#pt").value;s.ninea=$("#pni").value;s.rc=$("#prc").value;s.ger=$("#pg").value;s.par=$("#pr").value;s.dev=$("#pd").value;s.logoV=2;s.logo=$("#plg").value==LOGO0?"":($("#plg").value||"none");const p=$("#pp").value;if(/^\d{4}$/.test(p))s.pin=p;save();render();toast("Paramètres enregistrés")}
login();
</script>

window.sbMail=async function(){const em=(document.getElementById("sbm")||{}).value||"";DB.set.emailSauv=em.trim();save();const fn=sbName(),b=sbBlob(),sub="Sauvegarde "+DB.set.nom+" - "+new Date().toLocaleDateString("fr-FR"),body="Bonjour,\n\nVoici la sauvegarde du logiciel "+DB.set.nom+" (fichier "+fn+").";

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCBlVwUkKxuzmf7Zvq8jS--WmqyQ4PJdHY",
  authDomain: "ndiambour-quincaillerie.firebaseapp.com",
  projectId: "ndiambour-quincaillerie",
  storageBucket: "ndiambour-quincaillerie.firebasestorage.app",
  messagingSenderId: "964100777877",
  appId: "1:964100777877:web:cdf9f31bd116880e22789c"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "ndiambour", "principal");
let lastPush = "";
let pulling = false;
let ready = false;
// Envoi vers Firebase toutes les 3 secondes si ça a changé (seulement après la première lecture du serveur)
setInterval(()=>{
  try{
    if(pulling || !ready) return;
    const j = JSON.stringify(DB);
    if(j !== lastPush){
      lastPush = j;
      setDoc(ref, { data: DB, updatedAt: new Date().toISOString() });
    }
  }catch(e){}
}, 3000);
// Réception depuis Firebase - si un autre téléphone change, ça recharge ici
onSnapshot(ref, (snap)=>{
  ready = true;
  if(!snap.exists()) return;
  try{
    const d = snap.data().data;
    if(!d) return;
    const j = JSON.stringify(d);
    if(j === lastPush) return;
    lastPush = j;
    pulling = true;
    // On sauvegarde dans le navigateur et on recharge pour afficher
    Object.keys(DB).forEach(k=>{ DB[k]=d[k]; });
    try{ localStorage.setItem("ndiambour_db", j); }catch(e){}
    setTimeout(()=>{ pulling=false;  }, 500);
  }catch(e){ pulling=false; }
});
</script>
